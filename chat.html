<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聊天中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh; display: flex; flex-direction: column;
    background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333; overflow: hidden;
  }
  
  /* 顶部导航 */
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 20px; background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,0.05); z-index: 10;
  }
  .back-btn { font-size: 20px; color: #007aff; text-decoration: none; font-weight: 600; cursor: pointer; }
  .header-title { font-size: 17px; font-weight: 600; }
  .settings-btn { font-size: 20px; cursor: pointer; color: #888; padding: 5px; }

  /* 聊天区域 */
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; }
  .message {
    max-width: 80%; padding: 12px 16px; border-radius: 18px;
    font-size: 15px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.ai { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .message.user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(0,122,255,0.2); }
  .message.loading { color: #888; font-style: italic; }

  /* 底部输入 */
  .chat-input-area {
    display: flex; padding: 12px 15px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: #fff; box-shadow: 0 -1px 8px rgba(0,0,0,0.05);
  }
  #message-input { flex: 1; padding: 12px 16px; border: 1px solid #e5e5ea; border-radius: 22px; font-size: 15px; outline: none; background: #f2f2f7; }
  #send-btn { margin-left: 10px; padding: 0 20px; background: #007aff; color: #fff; border: none; border-radius: 22px; font-size: 15px; font-weight: 500; cursor: pointer; }
  #send-btn:disabled { background: #ccc; }

  /* 弹窗设置 */
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
  .modal.active { display: flex; }
  .modal-content { background: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto; }
  .modal-content h3 { text-align: center; }
  .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; }
  .modal-content textarea { height: 120px; resize: none; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #007aff; cursor: pointer; }
  .checkbox-row input { width: 18px; height: 18px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .btn-cancel { background: #eee; color: #333; }
  .btn-save { background: #007aff; color: #fff; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="chat-header">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title" id="character-name">默认角色</div>
    <div class="settings-btn" onclick="openSettings()">⚙️</div>
  </div>

  <div class="chat-messages" id="message-container"></div>

  <div class="chat-input-area">
    <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
    <button id="send-btn">发送</button>
  </div>

  <!-- 设置面板 -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>⚙️ 角色设置</h3>
      
      <!-- 专属 API 开关 -->
      <label class="checkbox-row">
        <input type="checkbox" id="use-custom-api" onchange="toggleCustomApi()">
        启用该角色专属 API
      </label>

      <!-- 专属 API 设置区域 -->
      <div id="custom-api-area" class="hidden" style="display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #f9f9f9; border-radius: 8px;">
        <select id="api-provider">
          <option value="deepseek">DeepSeek</option>
          <option value="zhipu">智谱 GLM</option>
        </select>
        <input type="password" id="api-key" placeholder="专属 API Key">
        <input type="text" id="api-model" placeholder="模型名称">
      </div>

      <p style="font-size:12px; color:#888; margin-top:5px;">角色人设 (System Prompt)</p>
      <textarea id="system-prompt" placeholder="输入该角色的人设设定..."></textarea>
      
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn-save" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

<script>
  /* ================= 初始化 ================= */
  const characterName = new URLSearchParams(window.location.search).get('name') || '默认角色';
  document.getElementById('character-name').textContent = characterName;

  const defaultPrompt = `你是一个人工智能伴侣，请根据用户的设定扮演相应的角色。你的回复应当自然、简短、有感情。`;

  // 全局 API 配置
  let globalApiConfig = JSON.parse(localStorage.getItem('globalApiConfig')) || { provider: 'deepseek', key: '', model: 'deepseek-chat' };

  // 角色本地配置（人设 + 专属API）
  let charConfig = JSON.parse(localStorage.getItem('charConfig_' + characterName)) || {
    prompt: defaultPrompt,
    useCustomApi: false,
    provider: 'deepseek',
    key: '',
    model: 'deepseek-chat'
  };

  let chatHistory = JSON.parse(localStorage.getItem('chatHistory_' + characterName)) || [];

  /* ================= 设置面板逻辑 ================= */
  function openSettings() {
    document.getElementById('system-prompt').value = charConfig.prompt;
    document.getElementById('use-custom-api').checked = charConfig.useCustomApi;
    
    document.getElementById('api-provider').value = charConfig.provider;
    document.getElementById('api-key').value = charConfig.key;
    document.getElementById('api-model').value = charConfig.model;
    
    toggleCustomApi(); // 刷新显示状态
    document.getElementById('settings-modal').classList.add('active');
  }

  function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

  function toggleCustomApi() {
    const isChecked = document.getElementById('use-custom-api').checked;
    document.getElementById('custom-api-area').style.display = isChecked ? 'flex' : 'none';
  }

  function saveSettings() {
    charConfig.prompt = document.getElementById('system-prompt').value.trim();
    charConfig.useCustomApi = document.getElementById('use-custom-api').checked;
    charConfig.provider = document.getElementById('api-provider').value;
    charConfig.key = document.getElementById('api-key').value.trim();
    charConfig.model = document.getElementById('api-model').value.trim();
    
    localStorage.setItem('charConfig_' + characterName, JSON.stringify(charConfig));
    closeSettings();
    alert('角色设置已保存！');
  }

  /* ================= 渲染与请求 ================= */
  function renderMessages() {
    const messagesContainer = document.getElementById('message-container');
    messagesContainer.innerHTML = '';
    chatHistory.forEach(msg => {
      if (msg.role === 'system') return;
      const div = document.createElement('div');
      div.className = `message ${msg.role === 'assistant' ? 'ai' : 'user'}`;
      div.textContent = msg.content;
      messagesContainer.appendChild(div);
    });
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  async function sendMessage() {
    const inputField = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const text = inputField.value.trim();
    if (!text) return;

    // 决定使用哪个 API 配置
    const activeConfig = charConfig.useCustomApi ? charConfig : globalApiConfig;

    if (!activeConfig.key) {
      alert(charConfig.useCustomApi ? '请先在设置中填入专属 API Key！' : '请先回主页设置全局 API Key！');
      return;
    }

    chatHistory.push({ role: 'user', content: text });
    inputField.value = '';
    renderMessages();

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message ai loading';
    loadingDiv.textContent = '正在输入...';
    document.getElementById('message-container').appendChild(loadingDiv);
    document.getElementById('message-container').scrollTop = document.getElementById('message-container').scrollHeight;
    sendBtn.disabled = true;

    let url = activeConfig.provider === 'deepseek' 
      ? 'https://api.deepseek.com/chat/completions' 
      : 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    
    const body = {
      model: activeConfig.model || (activeConfig.provider === 'deepseek' ? 'deepseek-chat' : 'glm-4-flash'),
      messages: [{ role: 'system', content: charConfig.prompt }, ...chatHistory]
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${activeConfig.key}` },
        body: JSON.stringify(body)
      });

      if (!response.ok) throw new Error('API 请求失败');
      
      const data = await response.json();
      const aiReply = data.choices[0].message.content;

      loadingDiv.remove();
      chatHistory.push({ role: 'assistant', content: aiReply });
      localStorage.setItem('chatHistory_' + characterName, JSON.stringify(chatHistory));
      renderMessages();

    } catch (error) {
      loadingDiv.textContent = '连接失败，可能是跨域或 Key 错误。';
      loadingDiv.style.color = 'red';
      console.error(error);
    } finally {
      sendBtn.disabled = false;
    }
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('message-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  renderMessages();
</script>
</body>
</html>
