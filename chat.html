<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聊天中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height: 100vh; display: flex; flex-direction: column; background: #f5f5f7; font-family: var(--theme-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); color: #333; overflow: hidden; }
  
  .chat-header { 
    display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; 
    background: var(--panel-bg, rgba(255, 255, 255, 0.7)); 
    backdrop-filter: var(--material-blur, blur(15px)); -webkit-backdrop-filter: var(--material-blur, blur(15px)); 
    border-bottom: var(--material-border, none);
    box-shadow: 0 1px 8px rgba(0,0,0,0.05); z-index: 10; transition: all 0.3s;
  }
  .back-btn { font-size: 20px; color: #007aff; text-decoration: none; font-weight: 600; cursor: pointer; }
  .header-title { font-size: 17px; font-weight: 600; }
  .settings-btn { font-size: 20px; cursor: pointer; color: #888; padding: 5px; }

  .chat-messages { 
    flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; 
    background: rgba(245, 245, 247, 0.1); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  
  .message-row { display: flex; align-items: flex-start; width: 100%; gap: 10px; animation: fadeIn 0.3s ease; }
  .message-row.user { flex-direction: row-reverse; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg-avatar { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #ddd; flex-shrink: 0; border: 1px solid #eee; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  
  /* 气泡：材质由 JS 动态注入的 CSS 变量控制 */
  .message { 
    max-width: 70%; padding: 12px 16px; 
    border-radius: var(--bubble-radius, 18px); 
    font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; 
    font-family: var(--theme-font, inherit); 
    border: var(--bubble-border, none);
    backdrop-filter: var(--bubble-blur, none); -webkit-backdrop-filter: var(--bubble-blur, none);
    transition: all 0.3s;
  }
  .message.ai { 
    background: var(--bubble-ai-bg, #ffffff); 
    color: var(--bubble-ai-text, #333); 
    border-top-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); 
  }
  .message.user { 
    background: var(--bubble-user-bg, #007aff); 
    color: var(--bubble-user-text, #ffffff); 
    border-top-right-radius: 4px; box-shadow: 0 1px 4px rgba(0,122,255,0.2); 
  }
  
  .message.ai::before { content: ''; position: absolute; top: 0; left: -8px; border: 8px solid transparent; border-top-color: var(--bubble-ai-tri, #fff); border-right-color: var(--bubble-ai-tri, #fff); }
  .message.user::before { content: ''; position: absolute; top: 0; right: -8px; border: 8px solid transparent; border-top-color: var(--bubble-user-tri, #007aff); border-left-color: var(--bubble-user-tri, #007aff); }

  .chat-input-area { 
    display: flex; padding: 12px 15px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
    background: var(--panel-bg, rgba(255, 255, 255, 0.7)); 
    backdrop-filter: var(--material-blur, blur(15px)); -webkit-backdrop-filter: var(--material-blur, blur(15px)); 
    border-top: var(--material-border, none);
    box-shadow: 0 -1px 8px rgba(0,0,0,0.05); transition: all 0.3s;
  }
  #message-input { flex: 1; padding: 12px 16px; border: 1px solid #e5e5ea; border-radius: 22px; font-size: 15px; outline: none; background: rgba(242, 242, 247, 0.8); }
  #send-btn { margin-left: 10px; padding: 0 20px; background: #007aff; color: #fff; border: none; border-radius: 22px; font-size: 15px; font-weight: 500; cursor: pointer; }
  #send-btn:disabled { background: #ccc; }

  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
  .modal.active { display: flex; }
  .modal-content { background: #fff; padding: 20px; border-radius: 16px; width: 95%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
  .modal-content h3 { text-align: center; font-size: 18px; color: #007aff; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 13px; color: #666; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #333; cursor: pointer; padding: 10px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; margin: 5px 0; }
  .checkbox-row input { width: 18px; height: 18px; }
  .custom-api-area { display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; }
  .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
  .btn-cancel { background: #eee; color: #333; }
  .btn-save { background: #007aff; color: #fff; }
  .btn-danger { background: #ff3b30; color: #fff; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="chat-header">
    <a href="chats.html" class="back-btn">←</a>
    <div class="header-title" id="character-name">默认角色</div>
    <div class="settings-btn" onclick="openSettings()">⚙️</div>
  </div>

  <div class="chat-messages" id="message-container"></div>

  <div class="chat-input-area">
    <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
    <button id="send-btn">发送</button>
  </div>

  <!-- 角色设置弹窗 -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>📇 角色卡设置</h3>
      <div class="form-group"><label>底层 ID</label><input type="text" id="card-name" disabled style="background:#f0f0f0; color:#999;"></div>
      <div class="form-group"><label>显示昵称 (备注)</label><input type="text" id="card-nickname" placeholder="如：夏小猫"></div>
      <div class="form-group"><label>性别 / 年龄</label><input type="text" id="card-gender" placeholder="选填"></div>
      <div class="form-group"><label>外貌特征</label><input type="text" id="card-appearance" placeholder="选填"></div>
      <div class="form-group"><label>性格标签</label><input type="text" id="card-personality" placeholder="如：傲娇, 年上, 猫系"></div>
      <div class="form-group"><label>背景故事</label><textarea id="card-background" placeholder="选填"></textarea></div>
      <div class="form-group"><label>说话风格</label><textarea id="card-speaking-style" placeholder="如：喜欢用反问句，口是心非"></textarea></div>
      <div class="form-group"><label>开场白</label><textarea id="card-first-message" placeholder="如：这么晚还不睡，是在等我吗？"></textarea></div>
      <div class="form-group"><label>补充指令</label><textarea id="card-system-prompt" placeholder="选填"></textarea></div>

      <label class="checkbox-row">
        <input type="checkbox" id="use-custom-api" onchange="toggleCustomApi()">
        启用专属 API
      </label>

      <div id="custom-api-area" class="custom-api-area hidden">
        <select id="api-provider"><option value="deepseek">DeepSeek</option><option value="zhipu">智谱 GLM</option></select>
        <input type="password" id="api-key" placeholder="专属 API Key">
        <input type="text" id="api-model" placeholder="模型名称">
      </div>
      
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeSettings()">取消</button>
        <button class="btn-save" onclick="saveSettings()">保存设置</button>
      </div>
      <button class="btn-danger" onclick="clearChat()">🗑️ 清空记录并重置</button>
    </div>
  </div>

<script>
  const characterName = new URLSearchParams(window.location.search).get('name') || '默认角色';
  document.getElementById('card-name').value = characterName;

  let globalApiConfig = JSON.parse(localStorage.getItem('globalApiConfig')) || { provider: 'deepseek', key: '', model: 'deepseek-chat' };
  let globalUser = JSON.parse(localStorage.getItem('globalUserConfig')) || { nickname: '我', avatar: '' };
  const defaultUserAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjMDA3YWZmIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGR5PSIuM2VtIiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjE0Ij5NZTwvdGV4dD48L3N2Zz4=';
  const defaultAiAvatar = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZWVlIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGR5PSIuM2VtIiBmaWxsPSIjODg4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjEyIj5BSTwvdGV4dD48L3N2Zz4=';

  const defaultCardData = { nickname: '', gender: '', appearance: '', personality: '', background: '', speakingStyle: '', firstMessage: '', systemPrompt: '', useCustomApi: false, provider: 'deepseek', key: '', model: 'deepseek-chat' };
  let charConfig = JSON.parse(localStorage.getItem('charConfig_' + characterName)) || { ...defaultCardData };
  let chatHistory = JSON.parse(localStorage.getItem('chatHistory_' + characterName)) || [];

  // 动态应用主题、气泡和材质
  let themeConfig = JSON.parse(localStorage.getItem('myThemeConfig')) || {};
  const root = document.documentElement;

  if (themeConfig.userBubbleColor) {
    // 颜色变量
    root.style.setProperty('--bubble-radius', themeConfig.bubbleRadius + 'px');
    root.style.setProperty('--theme-font', themeConfig.fontFamily);
    root.style.setProperty('--bubble-user-text', getContrastColor(themeConfig.userBubbleColor));
    root.style.setProperty('--bubble-ai-text', getContrastColor(themeConfig.aiBubbleColor));

    // 根据材质设置透明度、模糊和尖角颜色
    if (themeConfig.material === 'frosted') {
      root.style.setProperty('--bubble-user-bg', `rgba(${hexToRgb(themeConfig.userBubbleColor)}, 0.75)`);
      root.style.setProperty('--bubble-ai-bg', `rgba(${hexToRgb(themeConfig.aiBubbleColor)}, 0.75)`);
      root.style.setProperty('--bubble-user-tri', `rgba(${hexToRgb(themeConfig.userBubbleColor)}, 0.75)`);
      root.style.setProperty('--bubble-ai-tri', `rgba(${hexToRgb(themeConfig.aiBubbleColor)}, 0.75)`);
      root.style.setProperty('--bubble-blur', 'blur(15px)');
      root.style.setProperty('--bubble-border', '1px solid rgba(255,255,255,0.3)');
      root.style.setProperty('--panel-bg', 'rgba(255,255,255,0.6)');
      root.style.setProperty('--material-blur', 'blur(15px)');
      root.style.setProperty('--material-border', '1px solid rgba(255,255,255,0.3)');
    } else if (themeConfig.material === 'glass') {
      root.style.setProperty('--bubble-user-bg', `rgba(${hexToRgb(themeConfig.userBubbleColor)}, 0.35)`);
      root.style.setProperty('--bubble-ai-bg', `rgba(${hexToRgb(themeConfig.aiBubbleColor)}, 0.35)`);
      root.style.setProperty('--bubble-user-tri', `rgba(${hexToRgb(themeConfig.userBubbleColor)}, 0.35)`);
      root.style.setProperty('--bubble-ai-tri', `rgba(${hexToRgb(themeConfig.aiBubbleColor)}, 0.35)`);
      root.style.setProperty('--bubble-blur', 'blur(20px) saturate(180%)');
      root.style.setProperty('--bubble-border', '1px solid rgba(255,255,255,0.6)');
      root.style.setProperty('--panel-bg', 'rgba(255,255,255,0.2)');
      root.style.setProperty('--material-blur', 'blur(20px) saturate(180%)');
      root.style.setProperty('--material-border', '1px solid rgba(255,255,255,0.6)');
    } else {
      // Solid
      root.style.setProperty('--bubble-user-bg', `rgb(${hexToRgb(themeConfig.userBubbleColor)})`);
      root.style.setProperty('--bubble-ai-bg', `rgb(${hexToRgb(themeConfig.aiBubbleColor)})`);
      root.style.setProperty('--bubble-user-tri', `rgb(${hexToRgb(themeConfig.userBubbleColor)})`);
      root.style.setProperty('--bubble-ai-tri', `rgb(${hexToRgb(themeConfig.aiBubbleColor)})`);
      root.style.setProperty('--bubble-blur', 'none');
      root.style.setProperty('--bubble-border', 'none');
      root.style.setProperty('--panel-bg', 'rgba(255,255,255,0.95)');
      root.style.setProperty('--material-blur', 'none');
      root.style.setProperty('--material-border', 'none');
    }
  }

  function hexToRgb(hex) {
    hex = hex.replace("#", "");
    var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
    return `${r},${g},${b}`;
  }
  function getContrastColor(hexcolor) {
    if(!hexcolor) return '#333';
    hexcolor = hexcolor.replace("#", "");
    var r = parseInt(hexcolor.substr(0, 2), 16), g = parseInt(hexcolor.substr(2, 2), 16), b = parseInt(hexcolor.substr(4, 2), 16);
    return (((r * 299) + (g * 587) + (b * 114)) / 1000 >= 128) ? '#333333' : '#ffffff';
  }
  
  const chatBg = localStorage.getItem('bgImageChat') || localStorage.getItem('bgImageMain');
  if(chatBg) document.body.style.background = `url(${chatBg}) center/cover no-repeat fixed`;

  // ====== 业务逻辑 ======
  updateHeaderTitle();
  function updateHeaderTitle() { document.getElementById('character-name').textContent = charConfig.nickname || characterName; }
  function openSettings() {
    document.getElementById('card-nickname').value = charConfig.nickname || '';
    document.getElementById('card-gender').value = charConfig.gender || '';
    document.getElementById('card-appearance').value = charConfig.appearance || '';
    document.getElementById('card-personality').value = charConfig.personality || '';
    document.getElementById('card-background').value = charConfig.background || '';
    document.getElementById('card-speaking-style').value = charConfig.speakingStyle || '';
    document.getElementById('card-first-message').value = charConfig.firstMessage || '';
    document.getElementById('card-system-prompt').value = charConfig.systemPrompt || '';
    document.getElementById('use-custom-api').checked = charConfig.useCustomApi;
    document.getElementById('api-provider').value = charConfig.provider;
    document.getElementById('api-key').value = charConfig.key;
    document.getElementById('api-model').value = charConfig.model;
    toggleCustomApi(); document.getElementById('settings-modal').classList.add('active');
  }
  function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }
  function toggleCustomApi() { document.getElementById('custom-api-area').classList.toggle('hidden', !document.getElementById('use-custom-api').checked); }
  function buildSystemPrompt() {
    let prompt = `你正在扮演一个名为"${characterName}"的角色。`;
    if(charConfig.nickname) prompt += `用户给你起的昵称是"${charConfig.nickname}"。`;
    prompt += `\n请严格遵守设定。\n\n`;
    if (charConfig.gender) prompt += `【性别/年龄】${charConfig.gender}\n`;
    if (charConfig.appearance) prompt += `【外貌】${charConfig.appearance}\n`;
    if (charConfig.personality) prompt += `【性格】${charConfig.personality}\n`;
    if (charConfig.background) prompt += `【背景】${charConfig.background}\n`;
    if (charConfig.speakingStyle) prompt += `【说话风格】${charConfig.speakingStyle}\n`;
    if (charConfig.systemPrompt) prompt += `【补充指令】${charConfig.systemPrompt}\n`;
    prompt += `\n用自然、符合设定的语气与用户对话。`;
    return prompt;
  }
  function saveSettings() {
    charConfig.nickname = document.getElementById('card-nickname').value.trim();
    charConfig.gender = document.getElementById('card-gender').value.trim();
    charConfig.appearance = document.getElementById('card-appearance').value.trim();
    charConfig.personality = document.getElementById('card-personality').value.trim();
    charConfig.background = document.getElementById('card-background').value.trim();
    charConfig.speakingStyle = document.getElementById('card-speaking-style').value.trim();
    charConfig.firstMessage = document.getElementById('card-first-message').value.trim();
    charConfig.systemPrompt = document.getElementById('card-system-prompt').value.trim();
    charConfig.useCustomApi = document.getElementById('use-custom-api').checked;
    charConfig.provider = document.getElementById('api-provider').value;
    charConfig.key = document.getElementById('api-key').value.trim();
    charConfig.model = document.getElementById('api-model').value.trim();
    localStorage.setItem('charConfig_' + characterName, JSON.stringify(charConfig));
    closeSettings(); updateHeaderTitle(); 
    if (chatHistory.length === 0) renderMessages();
    alert('角色卡已保存！');
  }
  function clearChat() {
    if (confirm('确定要清空所有聊天记录吗？')) { chatHistory = []; localStorage.removeItem('chatHistory_' + characterName); renderMessages(); closeSettings(); }
  }

  function renderMessages() {
    const messagesContainer = document.getElementById('message-container');
    messagesContainer.innerHTML = '';
    if (chatHistory.length === 0 && charConfig.firstMessage) addMessageRow('ai', charConfig.firstMessage);
    chatHistory.forEach(msg => addMessageRow(msg.role === 'assistant' ? 'ai' : 'user', msg.content));
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function addMessageRow(role, text) {
    const container = document.getElementById('message-container');
    const row = document.createElement('div');
    row.className = `message-row ${role}`;
    let avatarSrc = role === 'ai' ? defaultAiAvatar : (globalUser.avatar || defaultUserAvatar);
    row.innerHTML = `<img src="${avatarSrc}" class="msg-avatar"><div class="message ${role}">${text}</div>`;
    container.appendChild(row);
  }

  async function sendMessage() {
    const inputField = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const text = inputField.value.trim();
    if (!text) return;
    const activeConfig = charConfig.useCustomApi ? charConfig : globalApiConfig;
    if (!activeConfig.key) { alert('请先设置 API Key！'); return; }

    chatHistory.push({ role: 'user', content: text });
    inputField.value = '';
    renderMessages();

    const container = document.getElementById('message-container');
    const loadingRow = document.createElement('div');
    loadingRow.className = 'message-row ai';
    loadingRow.innerHTML = `<img src="${defaultAiAvatar}" class="msg-avatar"><div class="message ai" style="color:#888; font-style:italic;">正在输入...</div>`;
    container.appendChild(loadingRow); container.scrollTop = container.scrollHeight;
    sendBtn.disabled = true;

    let url = activeConfig.provider === 'deepseek' ? 'https://api.deepseek.com/chat/completions' : 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
    const messagesToSend = [{ role: 'system', content: buildSystemPrompt() }];
    if (chatHistory.length === 1 && charConfig.firstMessage) messagesToSend.push({ role: 'assistant', content: charConfig.firstMessage });
    messagesToSend.push(...chatHistory);

    const body = { model: activeConfig.model || (activeConfig.provider === 'deepseek' ? 'deepseek-chat' : 'glm-4-flash'), messages: messagesToSend };

    try {
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${activeConfig.key}` }, body: JSON.stringify(body) });
      if (!response.ok) throw new Error('API 请求失败');
      const data = await response.json();
      loadingRow.remove();
      const aiText = data.choices[0].message.content;
      
      chatHistory.push({ role: 'assistant', content: aiText });
      localStorage.setItem('chatHistory_' + characterName, JSON.stringify(chatHistory));
      
      const prevHistory = chatHistory.slice(0, -1);
      container.innerHTML = '';
      prevHistory.forEach(msg => addMessageRow(msg.role === 'assistant' ? 'ai' : 'user', msg.content));

      const typewriterRow = document.createElement('div');
      typewriterRow.className = `message-row ai`;
      typewriterRow.innerHTML = `<img src="${defaultAiAvatar}" class="msg-avatar"><div class="message ai" id="typewriter-text"></div>`;
      container.appendChild(typewriterRow);
      
      const textContainer = document.getElementById('typewriter-text');
      let i = 0;
      const timer = setInterval(() => {
        if (i < aiText.length) { textContainer.textContent += aiText.charAt(i); i++; container.scrollTop = container.scrollHeight; } else { clearInterval(timer); }
      }, 50);
    } catch (error) {
      loadingRow.innerHTML = `<img src="${defaultAiAvatar}" class="msg-avatar"><div class="message ai" style="color:red;">连接失败，请检查跨域或 Key。</div>`;
    } finally { sendBtn.disabled = false; }
  }

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('message-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  renderMessages();
</script>
</body>
</html>
